name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Integration tests skip themselves on a machine without Docker. Here that would hide a broken runner.
      - name: Refuse skipped tests
        run: |
          reports=$(ls target/*-reports/TEST-*.xml)
          if grep -L 'skipped="0"' $reports | grep .; then
            echo "::error::The reports above have skipped tests"
            exit 1
          fi

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Check health
        run: curl -fsS http://localhost:8084/actuator/health | tee /dev/stderr | grep -q '"status":"UP"'

      - name: Send an e-mail and find it in Mailpit
        run: |
          curl -fsS -X POST http://localhost:8084/notifications \
            -H 'Content-Type: application/json' \
            -d '{"userId":"c-1001","recipient":{"name":"Ana Souza","email":"ana@exemplo.com"},"channels":["EMAIL"],"template":"GENERIC","params":{"title":"Cupom de sexta","message":"Seu cupom chegou."}}'
          echo
          for attempt in $(seq 1 30); do
            found=$(curl -fsS 'http://localhost:8025/api/v1/search?query=to:ana@exemplo.com' | jq '.messages_count')
            if [ "$found" = "1" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::The e-mail did not arrive in Mailpit"
          exit 1

      - name: Show logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
