name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Integration tests skip themselves on a machine without Docker. Here that would hide a broken runner.
      - name: Refuse skipped tests
        run: |
          reports=$(ls target/*-reports/TEST-*.xml)
          if grep -L 'skipped="0"' $reports | grep .; then
            echo "::error::The reports above have skipped tests"
            exit 1
          fi

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WITH_KAFKA: -f docker-compose.yml -f docker-compose.kafka.yml
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Check health
        run: curl -fsS http://localhost:8084/actuator/health | tee /dev/stderr | grep -q '"status":"UP"'

      # E-mail, retries, parking lot, preferences, idempotency and scheduling, with the intervals of the README.
      - name: Run the scenarios
        run: ./scripts/smoke-test.sh

      - name: Add Kafka and turn the order events on
        run: docker compose $WITH_KAFKA up -d --wait --wait-timeout 300

      - name: Publish an order event and find its e-mail
        run: ./scripts/smoke-test-kafka.sh

      - name: Show logs
        if: failure()
        run: docker compose $WITH_KAFKA logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose $WITH_KAFKA down -v

  publish:
    needs: [build, e2e]
    # Publishing only makes sense from main and while the repository is public.
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jhonatas-de-freitas/notification-service:latest
            ghcr.io/jhonatas-de-freitas/notification-service:${{ steps.sha.outputs.short }}
