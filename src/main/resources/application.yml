server:
  port: 8084

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notifications_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # The outbox relay waits for the broker to confirm each batch before deleting the rows.
    publisher-confirm-type: simple
    listener:
      simple:
        concurrency: 2
        prefetch: 10
        # A message the consumer cannot handle goes to the parking lot instead of looping forever.
        default-requeue-rejected: false
  mail:
    host: localhost
    port: 1025
    properties:
      # The notification row stays locked during the SMTP call, so the call must not hang.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

notifications:
  retry:
    # Wait after the 1st, 2nd and 3rd failed attempt. Short on purpose, to watch it happen.
    intervals: 5s,15s,45s
  outbox:
    poll-interval: 1s
  mail:
    from: "Loja Exemplo <loja@exemplo.com>"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbit
