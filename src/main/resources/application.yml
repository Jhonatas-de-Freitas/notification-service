server:
  port: 8084

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notifications_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # The outbox relay waits for the broker to confirm each batch before deleting the rows.
    publisher-confirm-type: simple
    listener:
      simple:
        concurrency: 2
        prefetch: 10
        # A message the consumer cannot handle goes to the parking lot instead of looping forever.
        default-requeue-rejected: false
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
    producer:
      # Only used to move a message to the dead letter topic. Short limits, so a broker that is
      # down does not hold the consumer for the one minute the client waits by default.
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  task:
    scheduling:
      pool:
        # The outbox relay can wait for seconds on a broker that is down.
        # A second thread keeps the scheduler on time meanwhile.
        size: 2
  mail:
    host: localhost
    port: 1025
    properties:
      # The notification row stays locked during the SMTP call, so the call must not hang.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

notifications:
  retry:
    # Wait after the 1st, 2nd and 3rd failed attempt. Short on purpose, to watch it happen.
    intervals: 5s,15s,45s
  outbox:
    poll-interval: 1s
  scheduler:
    # How often the scheduled notifications are checked, so one can leave up to this long after its time.
    poll-interval: 1s
  events:
    # Listens to orders.events on Kafka. Off by default, so the service runs without a broker.
    enabled: ${KAFKA_ENABLED:false}
    retry:
      # Attempts in total, counting the first one, before the message goes to notification-service.dlt.
      max-attempts: 4
      initial-interval: 200ms
      multiplier: 2.0
      max-interval: 5s
  mail:
    from: "Loja Exemplo <loja@exemplo.com>"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbit
