<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6;">
<tr>
<td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:8px;">
<tr>
<td style="padding:16px 28px;background-color:{{accent}};border-radius:8px 8px 0 0;color:#ffffff;font-size:15px;font-weight:bold;">{{store}}</td>
</tr>
<tr>
<td style="padding:28px;">
<h1 style="margin:0 0 16px;font-size:20px;line-height:1.3;color:#111827;">{{subject}}</h1>
<p style="margin:0 0 12px;font-size:15px;line-height:1.6;">Olá, {{name}}!</p>
{{content}}
</td>
</tr>
<tr>
<td style="padding:16px 28px;background-color:#f9fafb;border-top:1px solid #e5e7eb;border-radius:0 0 8px 8px;font-size:12px;line-height:1.5;color:#6b7280;">Esta é uma mensagem automática da {{store}}. Não é preciso responder.</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
